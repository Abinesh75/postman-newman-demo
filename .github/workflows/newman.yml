name: Run Postman API Tests

# This tells GitHub when to run this pipeline
on:
  
  push:         # when you push new code
  pull_request: # or create a pull request

jobs:
  test:
    runs-on: ubuntu-latest # GitHub gives you a free Linux VM to run the job

    steps:
      # Download your repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Install dependencies (Express, Newman, etc.)
      - name: Install dependencies
        run: npm ci

      # Start the server in the background
      - name: Start server
        run: |
          npm start &
          sleep 3  # wait 3 seconds for the server to start

      # Run Postman tests with Newman
      - name: Run Newman tests
        run: npm run test:postman

      # Upload reports as artifacts (you can download them later)
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-reports
          path: reports
